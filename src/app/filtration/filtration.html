<form [formGroup]="formInfo" (ngSubmit)="filterRooms()">
    <div class="box">
        <label for="min">Min Price</label>
        <input type="text" id="min" formControlName="PriceFrom">
    </div>
    <div class="box">
        <label for="max">Max Price</label>
        <input type="text" id="max" formControlName="PriceTo">
    </div>
    <div class="box">
        <label for="">Choose Room Type</label>
        <select name="" id="" formControlName="roomTypeId">
            <option value="1">Single Room</option>
            <option value="2">Double Room</option>
            <option value="3">Delux Room</option>
        </select>
    </div>
    <div class="box">
        <label for="">Choose Guests</label>
        <select formControlName="maximumGuests">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>
    </div>
    <div class="box">
        <label for="">Check In</label>
        <input type="date" formControlName="checkIn">
    </div>
    <div class="box">
        <label for="">Check Out</label>
        <input type="date" formControlName="checkOut">
    </div>
    <div class="box">
        <button [disabled]="formInfo.invalid" type="submit">APPLY FILTER</button>
        <button type="reset">RESET</button>
    </div>
</form>
